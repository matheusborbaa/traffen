name: Deploy via FTP (sem build)

on:
  push:
    branches:
      - main      # ou a branch que você usa
  workflow_dispatch: # permite rodar manualmente pelo botão "Run workflow"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Baixa o código do repositório
      - name: Checkout code
        uses: actions/checkout@v3

      # 2) Envia os arquivos para o servidor via FTP
      - name: Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Pasta local do projeto
          # se o Laravel estiver numa subpasta (ex: ./traffen), troque aqui
          local-dir: "./"

          # Pasta no servidor (ajuste conforme seu cPanel)
          # ex: "/public_html/", "/public_html/laravel/", etc.
          server-dir: "/public_html/"

          # O que NÃO enviar
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/*
            **/tests/*
            storage/logs/*
            storage/framework/sessions/*
            storage/framework/views/*
